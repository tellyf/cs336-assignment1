[project]
name = "bpe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.1",
    "einx>=0.3.0",
    "ipykernel>=6.30.1",
    "jaxtyping>=0.3.3",
    "memory-profiler>=0.61.0",
    "pytest>=8.4.2",
    "tiktoken>=0.12.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"] # Add your source directory to the Python path
testpaths = [
    "tests",
    "src"
]
